# Add to compose.yaml. Use compose.http.yaml as well for the HTTP service.
x-nvidia: &nvidia
  build:
    context: .
    args:
      TORCH_INDEX: "${LAYA_TORCH_INDEX:-cu126}"
  environment:
    LAYA_DEVICE: "${LAYA_DEVICE:-cuda}"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["${LAYA_GPU_ID:-0}"]
            capabilities: [gpu]

services:
  laya: *nvidia
  laya-serve: *nvidia
