[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-multimodal"
version = "0.5.3"
description = "Local, non-autoregressive System 1 decision engine for text and native media"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Convai Innovations" }
]
keywords = ["decision-model", "rlcd", "calibration", "system-one", "routing", "guardrails", "moderation", "triage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.8",
    "transformers>=5.5,<6",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "numpy>=1.20.0",
    # Verifies the Ed25519 signature on policies exported from Embedding Studio (laya_multimodal/policy.py).
    "cryptography>=41",
]

[tool.setuptools]
# assets/, research/ and notebooks/ sit in the root, so auto-discovery bails out.
packages = ["laya_multimodal", "laya_multimodal.mcp", "laya_multimodal.integrations"]

[project.optional-dependencies]
# Native media encoders, compact typed decisions, and local training.
multimodal = [
    "accelerate>=1.0", "peft>=0.18",
    "pillow>=10", "soundfile>=0.12", "scipy>=1.10", "librosa>=0.10",
    "torchvision>=0.23", "av>=14",
]
# Optional local or online reporting for the joint multimodal training script.
swanlab = ["swanlab[dashboard]>=0.10.6,<0.11"]
# `pip install laya-multimodal[serve]` adds the HTTP server (laya_multimodal.serve / the laya-multimodal-serve CLI).
serve = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.9",  # multipart image and media uploads
]
# `pip install laya-multimodal[mcp]` adds the MCP stdio server (laya_multimodal.mcp / the laya-multimodal-mcp-server CLI).
mcp = ["mcp>=2.2.0"]

# `pip install laya-multimodal[structured]` adds pydantic for the typed-model helpers (laya_multimodal/structured.py).
structured = ["pydantic>=2.0.0"]

# Optional local Vega reader with its upstream dependencies.
vega = ["vegaml>=0.18.0"]

# `pip install laya-multimodal[langchain]` adds the LangChain / LangGraph integrations (laya_multimodal.integrations).
langchain = [
    "langchain-core>=0.2.0",
    "langgraph>=0.1.0",
]
langgraph = [
    "langchain-core>=0.2.0",
    "langgraph>=0.1.0",
]

# `pip install laya-multimodal[llamaindex]` adds the LlamaIndex query router & selector integrations (laya_multimodal.integrations).
llamaindex = [
    "llama-index-core>=0.10.0",
]

# `pip install laya-multimodal[crewai]` adds the CrewAI multi-agent delegation router (laya_multimodal.integrations).
crewai = [
    "crewai>=0.28.0",
]

# `pip install laya-multimodal[agno]` adds the Agno multi-agent team routing and guardrail integration (laya_multimodal.integrations).
agno = [
    "agno>=1.1.14,<4",
]

[project.scripts]
laya-multimodal = "laya_multimodal.cli:main"
laya-multimodal-serve = "laya_multimodal.serve:main"
laya-multimodal-mcp-server = "laya_multimodal.mcp.server:main"
laya-multimodal-train-decisions = "laya_multimodal.multimodal_train:main"

[project.urls]
Homepage = "https://github.com/2351548518/laya"
Models = "https://huggingface.co/ZeeoRe/jev-multimodal-qwen3.5-4b"
Upstream = "https://github.com/NandhaKishorM/laya"
