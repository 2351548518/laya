name: Native evaluation

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  evaluator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[multimodal,serve]' pytest httpx
      - run: python -m pytest -q tests/test_multimodal_cli.py tests/test_evals_agreement.py tests/test_evals_tournament.py
