<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="2216" viewBox="0 0 1320 2216" role="img" aria-labelledby="title description" xml:lang="en">
  <title id="title">Qwen3.5-4B v6 two-stage supervised training</title>
  <desc id="description">Start from the original Qwen3.5-4B, warm up the candidate and box heads, then train LoRA, the merger and readouts. The diagram shows a four-GPU optimizer step, evaluation and resume snapshots.</desc>
  <defs>
    <style>
      text {
        fill: #252e3b;
        font-family: Arial, "Liberation Sans", sans-serif;
      }
      .center { text-anchor: middle; }
      .end { text-anchor: end; }
      .title { font-size: 39px; font-weight: 700; }
      .heading { font-size: 25px; font-weight: 700; }
      .label { font-size: 22px; font-weight: 600; }
      .small { font-size: 19px; fill: #3f4b59; }
      .code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .shape { font-size: 21px; font-weight: 600; }
      .panel { stroke: #35404e; stroke-width: 2.4; }
      .module { stroke: #465261; stroke-width: 1.9; }
      .note { stroke: #7f8e9b; stroke-width: 1.5; }
      .flow, .arrow { fill: none; stroke: #35404e; stroke-width: 2.3; }
      .arrow { marker-end: url(#arrow); }
      .zoom { stroke: #778b99; stroke-width: 2.15; stroke-dasharray: 8 6; }
    </style>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10.6" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 11 5.5 0 11Z" fill="#35404e" />
    </marker>
  </defs>

  <rect width="1320" height="2216" fill="#fdfdfa" />
  <text x="660" y="56" class="title center">Qwen3.5-4B v6 two-stage supervised training</text>
  <text x="660" y="88" class="small center">B: microbatch rows · L: left-padded sequence length · K: padded candidates · N: global window rows</text>

  <g id="initialization">
    <rect x="36" y="112" width="1248" height="76" rx="9" class="panel" fill="#f3e4cc" />
    <text x="660" y="144" class="heading center">Initialize from the original Qwen3.5-4B</text>
    <text x="660" y="171" class="small center">Seed 105 · initialize the candidate and single-v1 box heads</text>
    <path d="M420 188V215" class="arrow" />
  </g>


  <g id="stages">
    <rect x="36" y="215" width="766" height="171" rx="13" class="panel" fill="#e8efe4" />
    <text x="58" y="249" class="heading">Stage A · head warmup</text>
    <text x="58" y="278" class="small">warmup.jsonl · 30,720 rows · 1 epoch · 480 updates</text>
    <rect x="58" y="294" width="348" height="44" rx="6" class="module" fill="#deebde" />
    <rect x="430" y="294" width="350" height="44" rx="6" class="module" fill="#f4f4f2" />
    <text x="232" y="323" class="label center">Train candidate and box heads</text>
    <text x="605" y="323" class="label center">Freeze backbone + merger</text>
    <text x="58" y="366" class="small">Peak head LR 3e-4 · 4 rows/GPU microbatch · eval every 160 steps</text>
    <path d="M420 386V413" class="arrow" />

    <rect x="36" y="413" width="766" height="70" rx="9" class="panel" fill="#fff" />
    <text x="420" y="442" class="label center">Load head/best · create LoRA and AdamW</text>
    <text x="420" y="467" class="small center">Select by mean of modality-macro accuracy and box Acc@IoU≥0.5</text>
    <path d="M420 483V510" class="arrow" />

    <rect x="36" y="510" width="766" height="167" rx="13" class="panel" fill="#e1eaf5" />
    <text x="58" y="544" class="heading">Stage B · joint LoRA SFT</text>
    <text x="58" y="573" class="small">train.jsonl · 1,500,000 rows · 1 epoch · 23,438 updates</text>
    <rect x="58" y="589" width="348" height="44" rx="6" class="module" fill="#d9e8f6" />
    <rect x="430" y="589" width="350" height="44" rx="6" class="module" fill="#f4f4f2" />
    <text x="232" y="618" class="label center">Train LoRA, merger, heads</text>
    <text x="605" y="618" class="label center">Freeze base + vision encoder</text>
    <text x="58" y="657" class="small">Peak LR · LoRA 5e-5 · heads 2e-4 · merger 2e-5</text>
    <path d="M420 677V716" class="arrow" />
  </g>


  <g id="lora-shapes">
    <path d="M802 602H842" class="zoom" fill="none" />
    <rect x="842" y="215" width="442" height="462" rx="13" class="zoom" fill="#f6f9fa" />
    <text x="864" y="250" class="heading">LoRA in joint SFT</text>
    <text x="864" y="278" class="small">Example: gated full-attention o_proj</text>
    <text x="864" y="305" class="small code">rank = 32 · alpha = 64 · scale = 2</text>

    <rect x="864" y="325" width="398" height="45" rx="6" class="module" fill="#fff" />
    <text x="1063" y="355" class="label center">Input x [B, L, 4096]</text>
    <path d="M1063 370V384 M959 384H1167" class="flow" />
    <circle cx="1063" cy="384" r="3.4" fill="#35404e" />
    <path d="M959 384V401" class="arrow" />
    <path d="M1167 384V401" class="arrow" />

    <rect x="864" y="401" width="190" height="89" rx="6" class="module" fill="#f3efeb" />
    <text x="959" y="430" class="label center">Freeze W₀</text>
    <text x="959" y="454" class="small center">Weights [2560, 4096]</text>
    <text x="959" y="478" class="small center">Output [B, L, 2560]</text>
    <rect x="1072" y="401" width="190" height="89" rx="6" class="module" fill="#dae8f6" />
    <text x="1167" y="430" class="label center">Train Aₗ</text>
    <text x="1167" y="454" class="small center">Weights [32, 4096]</text>
    <text x="1167" y="478" class="small center">Output [B, L, 32]</text>

    <path d="M1167 490V509" class="arrow" />
    <rect x="1072" y="509" width="190" height="54" rx="6" class="module" fill="#dae8f6" />
    <text x="1167" y="533" class="label center">Train Bₗ</text>
    <text x="1167" y="554" class="small center">Weights [2560, 32]</text>

    <path d="M959 490V583" class="arrow" />
    <path d="M1167 563V583" class="arrow" />
    <rect x="864" y="583" width="398" height="72" rx="7" class="module" fill="#f5e9ce" />
    <text x="1063" y="612" class="label center">Output x(W₀ + 2 BₗAₗ)ᵀ</text>
    <text x="1063" y="641" class="shape code center">[B, L, 2560]</text>
  </g>


  <g id="optimizer-window">
    <rect x="36" y="716" width="1248" height="1228" rx="14" class="zoom" fill="#f8fafb" />
    <text x="60" y="751" class="heading">One optimizer step in either stage</text>
    <text x="1260" y="751" class="small end">Zero gradients at each window</text>

    <rect x="60" y="774" width="1200" height="78" rx="8" class="panel" fill="#f3e4cc" />
    <text x="660" y="807" class="heading center">Shuffle rows and take a global window N ≤ 64</text>
    <text x="660" y="835" class="small center">Balance work using inputs, tasks and admitted lengths · final SFT window has 32 rows</text>
    <path d="M660 852V871 M202 871H1118" class="flow" />
    <circle cx="660" cy="871" r="3.4" fill="#35404e" />
    <path d="M202 871V889" class="arrow" />
    <path d="M507 871V889" class="arrow" />
    <path d="M813 871V889" class="arrow" />
    <path d="M1118 871V889" class="arrow" />

    <g class="module" fill="#eee9f4">
      <rect x="62" y="889" width="280" height="57" rx="6" />
      <rect x="367" y="889" width="280" height="57" rx="6" />
      <rect x="673" y="889" width="280" height="57" rx="6" />
      <rect x="978" y="889" width="280" height="57" rx="6" />
    </g>
    <g class="label center">
      <text x="202" y="914">rank 0 · GPU 2</text>
      <text x="507" y="914">rank 1 · GPU 3</text>
      <text x="813" y="914">rank 2 · GPU 4</text>
      <text x="1118" y="914">rank 3 · GPU 5</text>
    </g>
    <g class="small center">
      <text x="202" y="936">N₀ rows</text>
      <text x="507" y="936">N₁ rows</text>
      <text x="813" y="936">N₂ rows</text>
      <text x="1118" y="936">N₃ rows</text>
    </g>
    <path d="M202 946V974 M507 946V974 M813 946V974 M1118 946V974" class="zoom" fill="none" />


    <g id="per-rank">
      <rect x="62" y="974" width="1196" height="736" rx="12" class="zoom" fill="#fff" />
      <text x="84" y="1002" class="heading">Work on each rank</text>
      <text x="1236" y="1002" class="small end">N₀ + N₁ + N₂ + N₃ = N</text>

      <rect x="84" y="1016" width="1152" height="90" rx="7" class="module" fill="#e9edf5" />
      <text x="660" y="1045" class="label center">Group by readout and media fields · left-pad to the longest sequence</text>
      <text x="660" y="1072" class="small center">B ≤ 4 in warmup or 2 in SFT · B × L ≤ 16,384</text>
      <text x="660" y="1095" class="small center">Rows of length 8,178 and 8,150 → [2, 8178] · 16,356 padded tokens</text>
      <path d="M660 1106V1131" class="arrow" />

      <rect x="84" y="1131" width="1152" height="99" rx="7" class="module" fill="#f3e4cc" />
      <text x="660" y="1163" class="label center">Qwen forward · input_ids and mask [B, L]</text>
      <text x="660" y="1190" class="small center">Shared hidden states H [B, L, 2560] · one task branch per microbatch</text>
      <text x="660" y="1215" class="small center">SFT uses activation checkpointing · offload saved tensors to CPU when B × L ≥ 3072</text>
      <path d="M660 1230V1246 M359 1246H961" class="flow" />
      <circle cx="660" cy="1246" r="3.4" fill="#35404e" />
      <path d="M359 1246V1265" class="arrow" />
      <path d="M961 1246V1265" class="arrow" />


      <g id="decision-loss">
        <rect x="84" y="1265" width="550" height="312" rx="10" class="panel" fill="#e9eff5" />
        <text x="105" y="1299" class="heading">Candidate supervision</text>
        <text x="105" y="1328" class="shape code">[B, L, 2560] → [B, K] logits</text>
        <text x="105" y="1354" class="small">Restore option order · targets and mask [B, K]</text>
        <text x="105" y="1380" class="small">Mask padded candidates · softmax over K</text>
        <text x="105" y="1406" class="label">Warmup · soft CE + 0.1 RPS + 0.5 Brier</text>
        <text x="105" y="1432" class="small">SFT uses soft CE · RPS applies to Score</text>

        <rect x="105" y="1450" width="508" height="66" rx="6" class="note" fill="#fff" />
        <text x="121" y="1476" class="small code">p = [0.1, 0.7, 0.2]   y = [0, 1, 0]</text>
        <text x="121" y="1502" class="small">Example loss · 0.4267 warmup · 0.3567 SFT</text>
        <text x="105" y="1550" class="label">Per-row [B] → mean microbatch loss</text>
      </g>


      <g id="box-loss">
        <rect x="686" y="1265" width="550" height="312" rx="10" class="panel" fill="#f0eaf4" />
        <text x="707" y="1299" class="heading">Single-box supervision</text>
        <text x="707" y="1328" class="shape code">[B, L, 2560] → [B, 1, 4] + [B, 1]</text>
        <text x="707" y="1354" class="small">Normalized xyxy and quality logit</text>
        <text x="707" y="1380" class="small">Both stages · quality only for empty boxes</text>
        <text x="707" y="1406" class="label">5 × L1 + 2 × (1 − GIoU) + 0.5 × BCE</text>
        <text x="707" y="1432" class="small">Quality target: detach(IoU) · zero for empty targets</text>

        <rect x="707" y="1450" width="508" height="66" rx="6" class="note" fill="#fff" />
        <text x="723" y="1476" class="small">L1 = 0.2, GIoU = 2/3, quality logit = 0</text>
        <text x="723" y="1502" class="small code">1 + 2/3 + 0.5 ln 2 ≈ 2.0132</text>
        <text x="707" y="1550" class="label">Per-row [B] → mean microbatch loss</text>
      </g>

      <path d="M359 1577V1595H961V1577" class="flow" />
      <path d="M660 1595V1614" class="arrow" />
      <circle cx="660" cy="1595" r="3.4" fill="#35404e" />
      <rect x="84" y="1614" width="1152" height="71" rx="7" class="module" fill="#deeee5" />
      <text x="660" y="1643" class="label center">Scale each loss by B/N and accumulate rank gradients</text>
      <text x="660" y="1672" class="small center">g_rank = Σ (B/N) × ∇L_micro · 2 rows in a 64-row window weigh 2/64</text>
    </g>

    <path d="M660 1685V1738" class="arrow" />
    <rect x="62" y="1738" width="1196" height="68" rx="8" class="panel" fill="#deeee5" />
    <text x="660" y="1767" class="label center">Sum gradients across four ranks · FP32 buckets</text>
    <text x="660" y="1794" class="shape code center">all_reduce(SUM) → g = g₀ + g₁ + g₂ + g₃</text>
    <path d="M660 1806V1834" class="arrow" />

    <rect x="62" y="1834" width="1196" height="91" rx="8" class="panel" fill="#f5e9ce" />
    <text x="660" y="1864" class="heading center">Clip global norm at 1.0 → one fused AdamW update</text>
    <text x="660" y="1891" class="small center">Group LR = peak × schedule · 5% linear warmup, then cosine decay to 10%</text>
    <text x="660" y="1915" class="small center">Warmup steps · Stage A: 24 · Stage B: 1,171</text>
  </g>


  <g id="evaluation-and-resume">
    <path d="M660 1925V1963 M340 1963H980" class="flow" />
    <circle cx="660" cy="1963" r="3.4" fill="#35404e" />
    <path d="M340 1963V1982" class="arrow" />
    <path d="M980 1963V1982" class="arrow" />

    <rect x="36" y="1982" width="608" height="202" rx="10" class="panel" fill="#e1eaf5" />
    <text x="58" y="2016" class="heading">SFT selection · sft/best</text>
    <text x="58" y="2045" class="small">Evaluate before training, every 500 steps and at the end</text>
    <text x="58" y="2073" class="small">1,624 decisions · 512 box rows (449 positive)</text>
    <text x="58" y="2101" class="small">A: modality-macro accuracy · G: box Acc@IoU≥0.5</text>
    <text x="58" y="2129" class="label">Select on the harmonic mean 2AG/(A+G)</text>
    <text x="58" y="2157" class="small">Max drop from start · 3 points per modality · 5 for boxes</text>

    <rect x="676" y="1982" width="608" height="202" rx="10" class="panel" fill="#eee9f4" />
    <text x="698" y="2016" class="heading">SFT resume snapshot</text>
    <text x="698" y="2045" class="small">Save every 250 steps, after eval and at the final step</text>
    <text x="698" y="2073" class="small">Trainable weights, AdamW state and evaluation</text>
    <text x="698" y="2101" class="small">Row order, progress, rank RNGs and selected model</text>
    <text x="698" y="2129" class="small">Publish checkpoint_latest.json after completion</text>
    <text x="698" y="2157" class="small">Retain the latest two complete snapshots</text>
  </g>
</svg>
