# DGX Spark uses the Linux ARM64 CUDA 13 wheel index.
x-spark: &spark
  platform: linux/arm64
  build:
    context: .
    args:
      TORCH_INDEX: "${LAYA_TORCH_INDEX:-cu130}"
  environment:
    LAYA_DEVICE: "${LAYA_DEVICE:-cuda}"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["${LAYA_GPU_ID:-0}"]
            capabilities: [gpu]

services:
  laya-multimodal: *spark
  laya-multimodal-serve: *spark
