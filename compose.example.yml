# Mount one-shot request data and media together. Request paths use /inputs inside the container.
services:
  laya:
    environment:
      LAYA_REQUEST_FILE: "${LAYA_REQUEST_FILE:-/inputs/request.json}"
    volumes:
      - type: bind
        source: "${LAYA_INPUT_DIR:-./examples/docker}"
        target: /inputs
        read_only: true
        bind:
          create_host_path: false
