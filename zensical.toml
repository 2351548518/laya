# Documentation site, built with Zensical (https://zensical.org). Preview locally:
#   pip install -r requirements-docs.txt && python scripts/docs_site.py serve

[project]
site_name = "laya-multimodal"
site_description = "Local System 1 decisions for text and native media"
repo_url = "https://github.com/2351548518/laya"
repo_name = "2351548518/laya"
edit_uri = "edit/main/docs/"
copyright = "Apache 2.0. Developed by Convai Innovations."
# Navigation is in docs/.nav.yml and docs_zh/.nav.yml. scripts/docs_site.py stages the site sources.

[project.theme]
# Reuse the repository's logo.
logo = "https://raw.githubusercontent.com/2351548518/laya/main/assets/logo-mark.svg"
favicon = "https://raw.githubusercontent.com/2351548518/laya/main/assets/logo-mark.svg"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.plugins.awesome-nav]

# API reference pages under docs/reference/ are generated from the docstrings in laya_multimodal/.
[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_options = { returns_multiple_items = false }
docstring_section_style = "list"
filters = ["!^_"]
members_order = "source"
merge_init_into_class = true
line_length = 70
separate_signature = true
show_root_full_path = false
show_root_heading = true
show_signature_annotations = true
show_source = false
